[options]
env_name = NH_center
dynamic_name = Multirotor

navigation_3d = True
using_velocity_state = False
reward_type = reward_wind
use_wind = True

;depth, lgmd, vector
perception = vector

algo = TD3
total_timesteps = 300000

policy_name = mlp
net_arch = [64, 32, 16]
;net_arch = {"pi":[64, 32, 16], "qf":[128,64,32]}
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
generate_q_map = False
q_map_save_steps = 1000

use_wandb = True

[wandb]
name = TD3-0-4-turbulence-reward_wind-mlp-critic-0.2
notes = none

[environment]
max_depth_meters = 15
screen_height = 80
screen_width = 100

crash_distance = 1
accept_radius = 2

[multirotor]
dt = 0.1
acc_xy_max = 2.0
v_xy_max = 5
v_xy_min = 0.5
v_z_max = 2.0
yaw_rate_max_deg = 30.0

; configs for DRL algorithms
[DRL]
gamma = 0.95
learning_rate = 5e-4
;learning_rate_actor = 5e-4
;learning_rate_critic = 2e-4
learning_starts = 2000
buffer_size = 60000
batch_size = 1280
train_freq = 500
gradient_steps = 300
action_noise_sigma = 0.1
;ent_coef = 0.25
;tau = 0.001

[wind]
seed = 42
use_turbulence = False

[PGVL]
;dual_stream
critic_mode = dual_stream
eta_rho = 0.2
physical_feature_dim = 4
omega_spatial = 0.7
omega_physical = 0.3
