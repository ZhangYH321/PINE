[options]
env_name = NH_center
dynamic_name = Multirotor

navigation_3d = True
using_velocity_state = True
reward_type = reward_final
; Obstacle shaping: use "legacy" to preserve the original linear penalty.
obstacle_penalty_mode = barrier
obstacle_safe_distance = 12.0
obstacle_crash_distance = 1.0
obstacle_penalty_lambda = 2.0
;depth, lgmd, vector
perception = vector

algo = TD3
model_variant = pine
total_timesteps = 300000
seed = 42

policy_name = mlp
net_arch = [64, 32, 16]
;net_arch = {"pi":[64, 32, 16], "qf":[128,64,32]}
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
generate_q_map = False
q_map_save_steps = 1000

use_wandb = False

[wandb]
project = PINE
name = PINE-NH-center
notes = none
;15
[environment]
max_depth_meters = 20
screen_height = 80
screen_width = 100

crash_distance = 1
accept_radius = 2

[multirotor]
dt = 0.1
acc_xy_max = 2.0
v_xy_max = 3.5
v_xy_min = 0.35
v_z_max = 2.0
yaw_rate_max_deg = 75.0
battery_capacity_wh = 6.0

; configs for DRL algorithms
[DRL]
gamma = 0.95
learning_rate = 5e-4
learning_starts = 2000
buffer_size = 80000
batch_size = 512
train_freq = 100
gradient_steps = 60
action_noise_sigma_initial = 0.15
action_noise_sigma_final = 0.05

[energy]
; airsim_rotor: AirSim rotor torque x angular speed (legacy/default)
; hover_calibrated_forward: AirSim hover power scaled by an airspeed power curve
power_model_mode = hover_calibrated_forward
; Fixed battery-side hover reference shared by every episode and method.
; Set to 0 only when intentionally calibrating once at environment startup.
fixed_hover_battery_power_w = 100.0
motor_esc_efficiency = 0.82
auxiliary_power_w = 10.0
expected_rotors = 4
profile_advance_coefficient = 4.6
power_observation_reference_w = 200.0

[mission]
; Default experiment: one goal per episode. A goal is still a deterministic
; function of the shared episode index, so methods see identical goals.
waypoint_count = 1

[wind]
model = correlated
apply_physics = True
observe_in_policy = True
reset_each_episode = True
apply_on_reset = True
apply_before_action = True
observation_semantics = goal_aligned_energy
airspeed_model = relative_ground_wind
speed_min = 0.5
speed_max = 1.5
grid_nx = 20
grid_ny = 20
grid_nz = 8
horizontal_length_scale = 30.0
vertical_length_scale = 8.0
spatial_std_horizontal = 0.3
spatial_std_vertical = 0.1
mean_profile = power_law
reference_height = 10.0
profile_exponent = 0.25
use_turbulence = True
turbulence_model = von_karman
sigma_n = 0.2
sigma_e = 0.2
sigma_d = 0.08
turbulence_time_scale = 0.7
turbulence_sequence_length = 4096
sensor_noise_std = 0.1
sensor_bias_std = 0.05
sensor_time_constant = 0.2
observation_scale = 2.5
log_trajectory = True
field_seed = 100
turbulence_seed = 200
sensor_seed = 300

[PGVL]
; Observation layout: 31 spatial/navigation values followed by 5 physical values.
spatial_feature_dim = 31
physical_feature_dim = 5
; Set true for adaptive spatial/physical fusion. When false, the critic uses
; only the 31 spatial features (plus action), with no physical stream.
use_adaptive_physics_gate = True
use_wind_residual_actor = True
residual_hidden_dim = 16
; Maximum speed/yaw residuals in SB3's normalized action space.
residual_max_action = 0.50
residual_yaw_max_action = 0.40
obstacle_feature_dim = 25
obstacle_proximity_threshold = 0.60
obstacle_transition = 0.15
minimum_wind_strength = 0.08
wind_strength_transition = 0.10
minimum_wind_confidence = 0.25
confidence_transition = 0.25

[checkpoint]
; Deterministic independent evaluation used for best_model selection.
eval_freq_steps = 40000
eval_episodes = 50
eval_seed = 1000003
